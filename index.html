<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Arcane Lexicon - Procedural Magic Circle Formation Engine with 3-spell Grimoire storage.">
    <title>Arcane Lexicon - Magic Circle Formation</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <!-- Ambient Background Glow Orbs -->
    <div class="bg-ambient">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="app-container">

        <!-- Header Row 1: Brand + Audio -->
        <header class="app-header">
            <div class="header-top">
                <div class="brand">
                    <div class="brand-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="9" />
                            <path d="M12 3v18M3 12h18M7.5 7.5l9 9M7.5 16.5l9-9" />
                        </svg>
                    </div>
                    <h1 class="brand-title">Arcane Lexicon</h1>
                </div>
                <button id="audio-toggle" class="btn-icon active" title="Toggle Sound">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M11 5L6 9H2v6h4l5 4V5zM19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
                    </svg>
                </button>
            </div>
            <!-- Header Row 2: Navigation Tabs -->
            <nav class="nav-tabs">
                <button class="tab-btn active" data-tab="studio">Studio</button>
                <button class="tab-btn" data-tab="grimoire">Grimoire</button>
            </nav>
        </header>

        <!-- Main Studio View -->
        <main id="view-studio" class="studio-main">

            <!-- Canvas Section (Always on top on mobile) -->
            <section class="canvas-section">
                <div class="canvas-wrapper">
                    <canvas id="magicCanvas" width="800" height="800"></canvas>
                </div>
            </section>

            <!-- Info Panel (Below canvas on mobile, side on desktop) -->
            <section class="panel panel-info">

                <!-- Spell Name -->
                <div class="spell-name-box">
                    <span class="field-label">Spell Designation</span>
                    <h2 id="spell-name" class="spell-name-display">Generating formation...</h2>
                </div>

                <!-- Characteristics -->
                <div class="characteristics-box">
                    <h3 class="box-title">Circle Characteristics</h3>
                    <div id="spell-details" class="details-list"></div>
                </div>

                <!-- Buttons -->
                <div class="actions-stack">
                    <button id="forge-btn" class="btn-forge">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                        </svg>
                        Forge Circle
                    </button>
                    <button id="save-grimoire-btn" class="btn-secondary">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                            <polyline points="17 21 17 13 7 13 7 21"/>
                            <polyline points="7 3 7 8 15 8"/>
                        </svg>
                        Inscribe to Grimoire
                    </button>
                </div>
            </section>
        </main>

        <!-- Grimoire View -->
        <section id="view-grimoire" class="panel panel-grimoire hidden">
            <div class="grimoire-header">
                <h2 class="panel-title">Grimoire Library</h2>
                <span id="grimoire-count-badge" class="capacity-badge">0 / 3</span>
            </div>
            <div id="grimoire-cards-container" class="grimoire-grid"></div>
        </section>

    </div>

    <script src="app.js"></script>
</body>
</html>
